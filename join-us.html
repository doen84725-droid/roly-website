<script>
  // 🔗 貼上你實際的 Apps Script Web App 部署網址
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwqZ-7bS7yXl01mK-E4p1l_f8pD2_O6E_S/exec';

  document.getElementById('recruitForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.innerText = '資料送出中...';
    submitBtn.disabled = true;

    const formData = {
      formType: 'recruit', // 👈 這行很關鍵！這樣 Apps Script 才知道要寫入「教練招募」分頁並發送紫色 LINE 通知
      name: document.getElementById('name').value,
      phone: document.getElementById('phone').value,
      job: document.getElementById('job').value,
      reason: document.getElementById('reason').value
    };

    fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(formData)
    })
    .then(response => {
      alert('🎉 諮詢申請已送出！我們將儘快與您聯繫安排對接！');
      document.getElementById('recruitForm').reset();
      submitBtn.innerText = '送出諮詢申請 ➔';
      submitBtn.disabled = false;
    })
    .catch(error => {
      alert('申請已送出！我們已收到您的資訊。');
      document.getElementById('recruitForm').reset();
      submitBtn.innerText = '送出諮詢申請 ➔';
      submitBtn.disabled = false;
    });
  });
</script>
